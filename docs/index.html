<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Monitor Aste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ee; --panel:#ffffff; --ink:#1b1d1f; --muted:#6b6f75; --line:#e2ded6;
  --accent:#b4471f; --accent-soft:#f6e3da; --ok:#2f7d4f; --warn:#b07a12; --hot:#c0392b;
  --chip:#ece8e1; --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121315;--panel:#1b1d20;--ink:#ecebe8;--muted:#9a9ea5;--line:#2c2f33;
  --accent:#e0794f;--accent-soft:#3a2219;--chip:#26292d;--ok:#5fbf86;--warn:#e0b04f;--hot:#ef6b5c;--shadow:none}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:1240px;margin:0 auto;padding:14px 16px 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:600;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.status{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.search{max-width:1240px;margin:0 auto;padding:0 16px 12px;display:flex;gap:8px;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input[type=search]{flex:1 1 260px}
.chips{max-width:1240px;margin:0 auto;padding:0 16px 12px;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid transparent;background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;user-select:none}
.chip b{font-weight:500;color:var(--muted);margin-left:4px}
.chip.on{background:var(--accent);color:#fff}
.chip.on b{color:#ffd9c9}
.chip.toggle.on{background:var(--ink);color:var(--bg)}
main{max-width:1240px;margin:0 auto;padding:14px 16px 60px}
.summary{color:var(--muted);font-size:13px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.card.new{border-color:var(--accent)}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.tag{background:var(--chip);border-radius:5px;padding:2px 7px;color:var(--muted)}
.tag.src{font-weight:600}
.tag.kw{background:var(--accent-soft);color:var(--accent)}
.tag.nuovo{background:var(--accent);color:#fff}
.title{font-weight:600;font-size:15px;line-height:1.35;margin:0;padding-right:30px}
.title a{color:inherit;text-decoration:none}
.title a:hover{text-decoration:underline}
.desc{color:var(--muted);font-size:13px;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.desc.open{-webkit-line-clamp:unset}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-top:auto;flex-wrap:wrap}
.price{font-size:19px;font-weight:600}
.price small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.when{text-align:right;font-size:13px}
.when .cd{display:block;font-weight:600}
.cd.soon{color:var(--hot)} .cd.mid{color:var(--warn)}
.place{font-size:13px;color:var(--muted)}
.star{position:absolute;top:10px;right:10px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--line);line-height:1;padding:4px}
.star.on{color:#e3a008}
.note{width:100%;font-size:13px;padding:6px 8px;display:none}
.card.fav .note,.note.has{display:block}
.thumb{width:100%;height:140px;object-fit:cover;border-radius:8px;background:var(--chip)}
.more{display:block;margin:20px auto;padding:10px 22px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
.err{background:var(--accent-soft);color:var(--accent);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px}
@media (max-width:600px){.grid{grid-template-columns:1fr}.status{margin-left:0}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Monitor <span>Aste</span></h1>
    <div class="status" id="status">Caricamento…</div>
  </div>
  <div class="search">
    <input type="search" id="q" placeholder="Cerca: rolex, gommone, Pescara, BMW…">
    <select id="regione"><option value="">Tutte le regioni</option></select>
    <input type="number" id="pmax" placeholder="Prezzo max €" min="0" step="500" style="width:140px">
    <select id="entro">
      <option value="">Qualsiasi scadenza</option>
      <option value="3">Entro 3 giorni</option>
      <option value="7">Entro 7 giorni</option>
      <option value="30">Entro 30 giorni</option>
    </select>
    <select id="ordine">
      <option value="scadenza">Scadenza più vicina</option>
      <option value="nuove">Più recenti</option>
      <option value="prezzo">Prezzo crescente</option>
      <option value="prezzo_desc">Prezzo decrescente</option>
    </select>
  </div>
  <div class="chips" id="cats"></div>
  <div class="chips" id="srcs"></div>
  <div class="chips" id="toggles">
    <span class="chip toggle" data-t="nuovi">Nuove 24h</span>
    <span class="chip toggle" data-t="kw">Solo parole chiave</span>
    <span class="chip toggle" data-t="fav">★ Preferiti</span>
  </div>
</header>
<main>
  <div id="errs"></div>
  <p class="summary" id="summary"></p>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>Mostra altre</button>
</main>
<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let DATA = null, ASTE = [], shown = 60;
const st = store.get('filtri', {q:'', regione:'', pmax:'', entro:'', ordine:'scadenza', cats:[], toggles:[]});
let favs = store.get('preferiti', {});
let notes = store.get('note', {});

const euro = v => v == null ? '—' : '€ ' + Math.round(v).toLocaleString('it-IT');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parseD = s => s ? new Date(s.length <= 10 ? s + 'T12:00' : s) : null;

function countdown(s){
  const d = parseD(s); if (!d) return ['—',''];
  const h = (d - Date.now()) / 36e5;
  if (h < 0) return ['in corso/scaduta', 'soon'];
  if (h < 48) return [`tra ${Math.round(h)} ore`, 'soon'];
  const g = Math.round(h / 24);
  return [`tra ${g} giorni`, g <= 7 ? 'mid' : ''];
}
function fmtData(s){
  const d = parseD(s); if (!d) return '';
  return d.toLocaleDateString('it-IT', {weekday:'short', day:'2-digit', month:'short'}) + (s.length > 10 ? ' ' + s.slice(11,16) : '');
}

async function load(){
  try{
    const r = await fetch('data/aste.json?t=' + Date.now());
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
  }catch(e){
    $('#status').textContent = 'Nessun dato ancora: il primo giro del monitor non è terminato.';
    return;
  }
  ASTE = DATA.aste || [];
  const upd = new Date(DATA.aggiornato);
  const fonti = Object.entries(DATA.fonti || {}).map(([k,v]) =>
    `<span><span class="dot" style="background:var(${v.ok ? '--ok' : '--hot'})"></span>${k}${v.ok ? '' : ' (errore)'}</span>`).join('');
  $('#status').innerHTML = `<span>Aggiornato ${upd.toLocaleString('it-IT',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span>${fonti}<span class="mono">${ASTE.length} aste</span>`;
  $('#errs').innerHTML = Object.entries(DATA.fonti || {}).filter(([,v]) => !v.ok)
    .map(([k,v]) => `<div class="err">${esc(k)} non raggiungibile nell'ultimo giro: ${esc(v.errore)}. Restano le aste già raccolte.</div>`).join('');

  const regs = [...new Set(ASTE.map(a => a.regione).filter(Boolean))].sort();
  $('#regione').innerHTML += regs.map(r => `<option>${esc(r)}</option>`).join('');
  const counts = {};
  ASTE.forEach(a => counts[a.categoria] = (counts[a.categoria] || 0) + 1);
  $('#cats').innerHTML = Object.entries(DATA.categorie).filter(([k]) => counts[k])
    .map(([k,l]) => `<span class="chip" data-c="${k}">${esc(l)}<b>${counts[k]}</b></span>`).join('');

  const fc = {};
  ASTE.forEach(a => fc[a.fonte] = (fc[a.fonte] || 0) + 1);
  $('#srcs').innerHTML = Object.entries(fc).sort((a,b) => b[1]-a[1])
    .map(([k,n]) => `<span class="chip toggle" data-s="${esc(k)}">${esc(k)}<b>${n}</b></span>`).join('');
  st.srcs = st.srcs || [];
  document.querySelectorAll('#srcs .chip').forEach(c => c.classList.toggle('on', st.srcs.includes(c.dataset.s)));
  for (const k of ['q','regione','pmax','entro','ordine']) $('#'+k).value = st[k] || ($('#'+k).tagName === 'SELECT' && k === 'ordine' ? 'scadenza' : '');
  document.querySelectorAll('#cats .chip').forEach(c => c.classList.toggle('on', st.cats.includes(c.dataset.c)));
  document.querySelectorAll('#toggles .chip').forEach(c => c.classList.toggle('on', st.toggles.includes(c.dataset.t)));
  render();
}

function filtered(){
  const words = st.q.toLowerCase().split(/\s+/).filter(Boolean);
  const pmax = parseFloat(st.pmax);
  const entro = parseInt(st.entro);
  const now = Date.now();
  const T = new Set(st.toggles);
  const srcs = st.srcs || [];
  let out = ASTE.filter(a => {
    if (st.cats.length && !st.cats.includes(a.categoria)) return false;
    if (st.regione && a.regione !== st.regione) return false;
    if (!isNaN(pmax) && a.prezzo_base != null && a.prezzo_base > pmax) return false;
    if (srcs.length && !srcs.includes(a.fonte)) return false;
    if (T.has('fav') && !favs[a.id]) return false;
    if (T.has('kw') && !(a.parole && a.parole.length)) return false;
    if (T.has('nuovi') && (now - parseD(a.visto_il)) > 864e5) return false;
    if (entro) { const d = parseD(a.scadenza); if (!d || d - now > entro * 864e5) return false; }
    if (words.length) {
      const t = (a.titolo + ' ' + a.descrizione + ' ' + a.citta + ' ' + a.provincia + ' ' + a.regione + ' ' + a.tribunale).toLowerCase();
      if (!words.every(w => t.includes(w))) return false;
    }
    return true;
  });
  const s = st.ordine;
  out.sort((a,b) =>
    s === 'nuove' ? (b.visto_il || '').localeCompare(a.visto_il || '') || (b.pubblicata||'').localeCompare(a.pubblicata||'') :
    s === 'prezzo' ? (a.prezzo_base ?? 1e12) - (b.prezzo_base ?? 1e12) :
    s === 'prezzo_desc' ? (b.prezzo_base ?? -1) - (a.prezzo_base ?? -1) :
    (a.scadenza || '9999').localeCompare(b.scadenza || '9999'));
  return out;
}

function card(a){
  const [cd, cls] = countdown(a.scadenza);
  const nuovo = (Date.now() - parseD(a.visto_il)) < 864e5;
  const luogo = [a.citta, a.provincia && a.provincia !== a.citta ? a.provincia : '', a.regione].filter(Boolean).join(', ');
  const prezzo = a.prezzo_base != null
    ? `${euro(a.prezzo_base)}${a.offerta_minima && a.offerta_minima !== a.prezzo_base ? `<small>offerta min. ${euro(a.offerta_minima)}</small>` : ''}`
    : (a.ribasso_pct ? `−${a.ribasso_pct}%<small>ribasso sul prezzo</small>` : `<small>prezzo nella scheda</small>`);
  const fav = !!favs[a.id];
  return `<article class="card${nuovo ? ' new' : ''}${fav ? ' fav' : ''}" data-id="${esc(a.id)}">
    <button class="star${fav ? ' on' : ''}" title="Preferito" data-fav="${esc(a.id)}">★</button>
    ${a.immagine ? `<img class="thumb" loading="lazy" src="${esc(a.immagine)}" alt="">` : ''}
    <div class="meta">
      ${nuovo ? '<span class="tag nuovo">Nuova</span>' : ''}
      <span class="tag src">${esc(a.fonte)}</span>
      <span class="tag">${esc(DATA.categorie[a.categoria] || a.categoria)}</span>
      ${(a.parole || []).map(p => `<span class="tag kw">${esc(p)}</span>`).join('')}
    </div>
    <h2 class="title"><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.titolo)}</a></h2>
    ${a.descrizione ? `<p class="desc" data-desc>${esc(a.descrizione)}</p>` : ''}
    <div class="place">${esc(luogo)}${a.tribunale ? (luogo ? ' · ' : '') + esc(a.tribunale) : ''}${a.procedura ? ` · proc. ${esc(a.procedura)}` : ''}${a.lotto ? ` · ${esc(a.lotto)}` : ''}</div>
    <div class="row">
      <div class="price">${prezzo}</div>
      <div class="when"><span class="cd ${cls}">${cd}</span>${fmtData(a.scadenza)}</div>
    </div>
    <input class="note${notes[a.id] ? ' has' : ''}" data-note="${esc(a.id)}" placeholder="Note (custode, sopralluogo, offerta max…)" value="${esc(notes[a.id] || '')}">
  </article>`;
}

function render(){
  if (!DATA) return;
  const list = filtered();
  $('#summary').textContent = `${list.length.toLocaleString('it-IT')} aste trovate`;
  $('#grid').innerHTML = list.length ? list.slice(0, shown).map(card).join('') : '<div class="empty">Nessuna asta con questi filtri.</div>';
  $('#more').hidden = list.length <= shown;
}

function save(){ store.set('filtri', st); shown = 60; render(); }
for (const k of ['q','regione','pmax','entro','ordine']) {
  $('#'+k).addEventListener(k === 'q' || k === 'pmax' ? 'input' : 'change', e => { st[k] = e.target.value; save(); });
}
$('#cats').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  const k = c.dataset.c; st.cats = st.cats.includes(k) ? st.cats.filter(x => x !== k) : [...st.cats, k];
  c.classList.toggle('on'); save();
});
$('#srcs').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  const k = c.dataset.s; st.srcs = (st.srcs || []).includes(k) ? st.srcs.filter(x => x !== k) : [...(st.srcs || []), k];
  c.classList.toggle('on'); save();
});
$('#toggles').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  const k = c.dataset.t; st.toggles = st.toggles.includes(k) ? st.toggles.filter(x => x !== k) : [...st.toggles, k];
  c.classList.toggle('on'); save();
});
$('#grid').addEventListener('click', e => {
  const f = e.target.closest('[data-fav]');
  if (f) { const id = f.dataset.fav; if (favs[id]) delete favs[id]; else favs[id] = Date.now(); store.set('preferiti', favs);
    f.classList.toggle('on'); f.closest('.card').classList.toggle('fav'); return; }
  const d = e.target.closest('[data-desc]'); if (d) d.classList.toggle('open');
});
$('#grid').addEventListener('input', e => {
  const n = e.target.closest('[data-note]'); if (!n) return;
  notes[n.dataset.note] = n.value; if (!n.value) delete notes[n.dataset.note]; store.set('note', notes);
});
$('#more').addEventListener('click', () => { shown += 60; render(); });
load();
</script>
</body>
</html>
