# ============================================================
#  MONITOR ASTE — impostazioni tecniche (pubbliche)
#  Le impostazioni personali (lista, parole chiave, prezzi, casa,
#  avvisi) stanno in privato.enc, cifrate con la tua password.
#  Si cambiano col bot Telegram (/aiuto) oppure con
#  "Modifica impostazioni.bat" sul PC.
# ============================================================

# Fonti da controllare (true = accesa, false = spenta)
fonti:
  pvp: true                  # Portale Vendite Pubbliche: tutte le giudiziarie e fallimentari
  demanio: true              # Agenzia del Demanio: veicoli e beni confiscati (legge anche i bandi PDF)
  industrial_discount: true  # macchinari, veicoli, nautica (giudiziarie + vendite da aziende)
  astebusiness: true         # aste giudiziarie e private
  gobid: true                # letto dal PC di casa, se il programma Gobid è attivo

# Giorni di annunci da recuperare al primo avvio (poi lavora solo sui nuovi)
backfill_giorni: 30

# Quante aste PVP completare per giro con il portale dell'offerta e la foto
pvp_portali_per_giro: 1200
foto_per_giro: 600

# Massimo messaggi Telegram per giro (il resto va in un messaggio di riepilogo)
max_avvisi_per_giro: 25
