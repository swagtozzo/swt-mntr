# ============================================================
#  MONITOR ASTE — configurazione
#  Modifica questo file direttamente su GitHub (icona matita):
#  al prossimo giro il monitor userà i nuovi criteri.
# ============================================================

# Fonti da controllare (true = accesa, false = spenta)
fonti:
  pvp: true                  # Portale Vendite Pubbliche: tutte le giudiziarie e fallimentari
  demanio: true              # Agenzia del Demanio: veicoli e beni confiscati
  industrial_discount: true  # macchinari, veicoli, nautica (giudiziarie + vendite da aziende)
  astebusiness: true         # aste giudiziarie e private
  gobid: true                # letto dal tuo PC (cartella pc/): GitHub viene bloccato da Gobid

# Giorni di annunci da recuperare al primo avvio (poi lavora solo sui nuovi)
backfill_giorni: 30

# ------------------------------------------------------------
# COSA ENTRA NELLA DASHBOARD
# Un lotto entra se appartiene a una categoria attiva qui sotto
# OPPURE contiene una delle parole chiave (qualsiasi categoria).
# ------------------------------------------------------------
categorie:
  auto_moto: true
  immobili: true
  macchinari: true
  orologi_gioielli: true
  moda_lusso: true
  sport_outdoor: true
  nautica: true

# Limiti per non riempire la dashboard di immobili da milioni
immobili:
  prezzo_max: 400000        # prezzo base massimo (€); metti null per nessun limite
  regioni: []               # vuoto = tutta Italia; es. ["Abruzzo", "Marche", "Molise"]

# Parole chiave: fanno entrare il lotto e lo evidenziano (maiuscole/minuscole indifferenti)
parole_chiave:
  # orologi
  - rolex
  - omega
  - seiko
  - tudor
  - cartier
  - patek
  - audemars
  - panerai
  - breitling
  - iwc
  - longines
  - tag heuer
  - grand seiko
  # moda / lusso
  - louis vuitton
  - gucci
  - prada
  - hermes
  - chanel
  - dior
  - balenciaga
  - moncler
  - jordan
  - yeezy
  - sneakers
  # sport / mare
  - surf
  - sup
  - kitesurf
  - windsurf
  - gommone
  - barca
  - natante
  - fuoribordo
  - motoscafo
  - casco moto
  - tuta moto
  - giubbotto moto
  - dainese
  - alpinestars

# Parole che escludono il lotto (es. rottami, quote parziali)
parole_escluse:
  - rottame
  - demolizione
  - nuda proprietà
  - quota di 1/

# ------------------------------------------------------------
# LA TUA LISTA — oggetti precisi che cerchi
# Ogni voce:
#   nome:       come compare in dashboard e su Telegram
#   parole:     basta che ce ne sia UNA nel titolo/descrizione
#   anche:      (facoltativo) deve esserci ANCHE una di queste
#   escludi:    (facoltativo) se c'è una di queste, il lotto viene ignorato
#   prezzo_max: (facoltativo) prezzo base massimo in €
#   regioni:    (facoltativo) solo in queste regioni (vuoto = tutta Italia)
#   categorie:  (facoltativo) solo in queste categorie
# Ogni lotto nuovo che corrisponde ti arriva su Telegram, prima di tutti gli altri.
# ------------------------------------------------------------
lista:
  - nome: BMW E36 e ricambi
    parole: [e36, bmw 316, bmw 318, bmw 320, bmw 323, bmw 325, bmw 328, m50, m52]
    prezzo_max: 8000

  - nome: Alfa Romeo MiTo e ricambi
    parole: [mito, alfa mito]
    anche: [alfa, romeo]
    prezzo_max: 8000

  - nome: Seiko e orologi da modding
    parole: [seiko, skx, nh35, nh36, nh34, nh38, orient, citizen, casio g-shock]

  - nome: Orologi di lusso
    parole: [rolex, omega, tudor, cartier, panerai, iwc, breitling, longines, tag heuer, jaeger, patek, audemars, zenith]

  - nome: Pesca a spinning
    parole: [canna da pesca, canne da pesca, mulinello, mulinelli, shimano, daiwa, spinning, attrezzatura da pesca, artificiali]

  - nome: Barca o gommone piccolo
    parole: [gommone, natante, barca, barchino, fuoribordo, motore marino, kayak, canoa, pedalò]
    escludi: [nave, peschereccio, yacht, porto turistico]
    prezzo_max: 15000

  - nome: Surf, SUP e kite
    parole: [tavola da surf, tavole da surf, surf, surfboard, tavola sup, sup board, sup gonfiabile, stand up paddle, paddle board, kitesurf, windsurf, muta stagna, muta neoprene]

  - nome: Abbigliamento moto
    parole: [casco moto, caschi, dainese, alpinestars, spidi, rev'it, giubbotto moto, giacca moto, tuta moto, stivali moto, shoei, arai, agv]

  - nome: Attrezzatura palestra
    parole: [bilanciere, manubri, panca piana, rack, power rack, dischi ghisa, kettlebell, multipower, lat machine, attrezzi palestra]
    prezzo_max: 3000

  - nome: Arredo salotto di design
    parole: [divano, credenza, madia, tavolino, poltrona, lampada, cassina, b&b italia, poltrona frau, minotti, kartell, flos, artemide, vitra, molteni]
    regioni: [Abruzzo, Marche, Molise]
    prezzo_max: 3000

  - nome: Borse, sneakers e lusso
    parole: [louis vuitton, hermes, hermès, chanel, gucci, prada, dior, fendi, bottega veneta, moncler, jordan, yeezy, off-white]

# ------------------------------------------------------------
# OCCASIONI
# Un lotto diventa "Occasione" quando ha almeno `punti_min` di questi segnali:
#   tentativo di vendita alto, ribasso forte, prezzo sceso rispetto a quando
#   il monitor l'ha visto la prima volta, prezzo basso per la categoria,
#   vicino a casa, parole chiave trovate.
# ------------------------------------------------------------
occasioni:
  punti_min: 2
  tentativi_min: 3          # dal 3° tentativo (le prime due aste deserte)
  ribasso_min: 40           # ribasso dichiarato in %
  calo_min_pct: 20          # prezzo sceso di almeno il 20% rispetto allo storico
  regioni_casa: [Abruzzo, Marche, Molise]
  prezzo_basso:             # prezzo base massimo per considerarlo "basso"
    auto_moto: 3000
    nautica: 5000
    orologi_gioielli: 1500
    moda_lusso: 800
    sport_outdoor: 500
    macchinari: 2000
    immobili: 40000

# ------------------------------------------------------------
# AVVISI TELEGRAM
# Ti arriva un messaggio per ogni NUOVO lotto che rispetta almeno una regola.
# Ogni regola: tutti i campi indicati devono essere veri.
#   categorie: lista di categorie (vedi sopra)
#   parole: almeno una parola presente nel testo
#   regioni: lista di regioni (vuoto/assente = ovunque)
#   prezzo_max: prezzo base massimo in €
#   solo_occasioni: true = solo i lotti segnati come Occasione
# ------------------------------------------------------------
avvisi:
  - nome: "Occasione"
    solo_occasioni: true

  - nome: "Orologi e lusso, tutta Italia"
    categorie: [orologi_gioielli, moda_lusso]

  - nome: "Parole chiave, tutta Italia"
    parole: [rolex, omega, seiko, tudor, cartier, patek, audemars, panerai, louis vuitton, hermes, chanel, jordan, surf, sup, kitesurf, gommone, dainese, alpinestars]

  - nome: "Auto, moto e barche vicino casa"
    categorie: [auto_moto, nautica]
    regioni: [Abruzzo, Marche, Molise]
    prezzo_max: 30000

  - nome: "Immobili Abruzzo sotto 120k"
    categorie: [immobili]
    regioni: [Abruzzo]
    prezzo_max: 120000

# Massimo messaggi Telegram per giro (il resto va in un riepilogo)
max_avvisi_per_giro: 25
