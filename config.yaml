# ============================================================
#  MONITOR ASTE — configurazione
#  Modifica questo file direttamente su GitHub (icona matita):
#  al prossimo giro il monitor userà i nuovi criteri.
# ============================================================

# Fonti da controllare (true = accesa, false = spenta)
fonti:
  pvp: true                  # Portale Vendite Pubbliche: tutte le giudiziarie e fallimentari
  demanio: true              # Agenzia del Demanio: veicoli e beni confiscati
  industrial_discount: true  # macchinari, veicoli, nautica (giudiziarie + vendite da aziende)
  astebusiness: true         # aste giudiziarie e private
  gobid: false               # blocca i server di GitHub (errore 403): lasciare spento

# Giorni di annunci da recuperare al primo avvio (poi lavora solo sui nuovi)
backfill_giorni: 30

# ------------------------------------------------------------
# COSA ENTRA NELLA DASHBOARD
# Un lotto entra se appartiene a una categoria attiva qui sotto
# OPPURE contiene una delle parole chiave (qualsiasi categoria).
# ------------------------------------------------------------
categorie:
  auto_moto: true
  immobili: true
  macchinari: true
  orologi_gioielli: true
  moda_lusso: true
  sport_outdoor: true
  nautica: true

# Limiti per non riempire la dashboard di immobili da milioni
immobili:
  prezzo_max: 400000        # prezzo base massimo (€); metti null per nessun limite
  regioni: []               # vuoto = tutta Italia; es. ["Abruzzo", "Marche", "Molise"]

# Parole chiave: fanno entrare il lotto e lo evidenziano (maiuscole/minuscole indifferenti)
parole_chiave:
  # orologi
  - rolex
  - omega
  - seiko
  - tudor
  - cartier
  - patek
  - audemars
  - panerai
  - breitling
  - iwc
  - longines
  - tag heuer
  - grand seiko
  # moda / lusso
  - louis vuitton
  - gucci
  - prada
  - hermes
  - chanel
  - dior
  - balenciaga
  - moncler
  - jordan
  - yeezy
  - sneakers
  # sport / mare
  - surf
  - sup
  - kitesurf
  - windsurf
  - gommone
  - barca
  - natante
  - fuoribordo
  - motoscafo
  - casco moto
  - tuta moto
  - giubbotto moto
  - dainese
  - alpinestars

# Parole che escludono il lotto (es. rottami, quote parziali)
parole_escluse:
  - rottame
  - demolizione
  - nuda proprietà
  - quota di 1/

# ------------------------------------------------------------
# AVVISI TELEGRAM
# Ti arriva un messaggio per ogni NUOVO lotto che rispetta almeno una regola.
# Ogni regola: tutti i campi indicati devono essere veri.
#   categorie: lista di categorie (vedi sopra)
#   parole: almeno una parola presente nel testo
#   regioni: lista di regioni (vuoto/assente = ovunque)
#   prezzo_max: prezzo base massimo in €
# ------------------------------------------------------------
avvisi:
  - nome: "Orologi e lusso, tutta Italia"
    categorie: [orologi_gioielli, moda_lusso]

  - nome: "Parole chiave, tutta Italia"
    parole: [rolex, omega, seiko, tudor, cartier, patek, audemars, panerai, louis vuitton, hermes, chanel, jordan, surf, sup, kitesurf, gommone, dainese, alpinestars]

  - nome: "Auto, moto e barche vicino casa"
    categorie: [auto_moto, nautica]
    regioni: [Abruzzo, Marche, Molise]
    prezzo_max: 30000

  - nome: "Immobili Abruzzo sotto 120k"
    categorie: [immobili]
    regioni: [Abruzzo]
    prezzo_max: 120000

# Massimo messaggi Telegram per giro (il resto va in un riepilogo)
max_avvisi_per_giro: 25
