name: Monitor aste

on:
  schedule:
    - cron: "17 * * * *"      # ogni ora, anche di notte (servono per i promemoria)
  workflow_dispatch: {}       # pulsante "Run workflow" o comando /aggiorna del bot
  push:
    branches: [main]
    paths: ["config.yaml", "privato.enc", "preferenze.json", "docs/index.html", "monitor.py", "extra.py", "gobid/gobid.json"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: monitor-aste
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recupera i dati del giro precedente
        run: |
          mkdir -p docs/data
          BASE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/data"
          for f in aste.enc aste.json archivio.enc archivio.json; do
            curl -fsSL "$BASE/$f" -o "docs/data/$f" || rm -f "docs/data/$f"
          done
          ls -la docs/data

      - name: Controlla i portali
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHIAVE_DATI: ${{ secrets.CHIAVE_DATI }}
        run: python monitor.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
