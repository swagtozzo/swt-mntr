name: Comandi Telegram

on:
  schedule:
    - cron: "*/5 * * * *"     # legge i comandi ogni 5 minuti
  workflow_dispatch: {}

permissions:
  contents: write     # per salvare le impostazioni cambiate col bot
  actions: write      # per rilanciare il monitor dopo una modifica

concurrency:
  group: bot-telegram
  cancel-in-progress: false

jobs:
  comandi:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests PyYAML cryptography

      - name: Leggi ed esegui i comandi
        id: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHIAVE_DATI: ${{ secrets.CHIAVE_DATI }}
        run: |
          export DATI_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/data"
          python bot.py

      - name: Salva le impostazioni
        if: steps.bot.outputs.modificato == 'true'
        run: |
          git config user.name "monitor-aste-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.bot.outputs.file }}"
          git commit -m "Impostazioni aggiornate dal bot Telegram"
          git pull --rebase --quiet
          git push

      - name: Segna i messaggi come letti
        if: steps.bot.outputs.conferma != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${{ steps.bot.outputs.conferma }}&timeout=0"

      - name: Rilancia il monitor
        if: steps.bot.outputs.aggiorna == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}"

      # GitHub spegne i controlli programmati dopo 60 giorni senza attività nel repository:
      # una volta al mese salvo un file minuscolo per tenerlo sveglio.
      - name: Mantieni attivo il repository
        run: |
          ULTIMO=$(git log -1 --format=%ct)
          ADESSO=$(date +%s)
          if [ $(( (ADESSO - ULTIMO) / 86400 )) -ge 30 ]; then
            date -u +%Y-%m-%dT%H:%MZ > .attivo
            git config user.name "monitor-aste-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .attivo
            git commit -m "Mantieni attivo il monitor"
            git pull --rebase --quiet
            git push
          fi
